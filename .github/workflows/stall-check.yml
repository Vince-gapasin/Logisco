name: Watch for stalled trucks

# Asks the deployment whether any truck on the road has gone quiet.
#
# Manual only now. It is a way to ask the question on demand, not the thing that
# keeps asking it - see below.
#
# THE SCHEDULE HAS MOVED TO THE DATABASE
#
# This asked for "*/10 * * * *" and GitHub did not honour it. Measured against
# the Actions API over three days, fourteen consecutive gaps: median 277 minutes,
# range 132 to 500, fifteen runs in total. Short intervals on a free public
# repository are the first thing GitHub drops when it is busy.
#
# What that cost: the scheduled POST is the only thing that notifies anyone, so a
# trip that went quiet got one alert hours late, at whichever rung the clock had
# already passed - "Still nothing after 5 hours" and nothing at 15, 30 or 45.
#
# pg_cron runs it now, on the minute, from inside the database. See
# supabase/migrations/20260929000000_stall_check_schedule.sql.
#
# The manual trigger stays. It is the quickest way to ask the deployment what it
# thinks right now without waiting for the next run, and it is how you check the
# endpoint still answers 200 after a deploy.

on:
  workflow_dispatch:

# A late run and a new run doing the same work helps nobody.
concurrency:
  group: stall-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ask the deployment
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://logisco.company' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::No CRON_SECRET secret, so the scheduled check cannot authenticate. Add it in Settings > Secrets > Actions, with the same value as the deployment's."
            exit 0
          fi

          # POST, not GET: the GET is the board's read-only view and notifies
          # nobody. This method is the only one that tells anyone.
          #
          # Deliberately not -L. The address has moved once already, and
          # following a redirect to another host drops the Authorization header
          # on the way - curl will not carry credentials across hosts without
          # --location-trusted, and neither does pg_net. So -L does not rescue a
          # moved address here; it converts a 307 that says exactly what is
          # wrong into a 401 that says the secret has drifted. It has not. This
          # is how the database schedule lost four runs before anyone noticed.
          response=$(curl -sS -X POST -H "Content-Length: 0" -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/fleet/stall-check")

          status=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::The stall check answered $status"

            # Naming the two that have actually happened, because neither code
            # means what it first looks like it means here.
            if [ "$status" = "307" ] || [ "$status" = "308" ]; then
              echo "::error::That is a redirect, not a refusal: $APP_URL is not where the site answers any more. Update the APP_URL secret, capacitor.config.ts and the pg_cron job."
            elif [ "$status" = "401" ]; then
              echo "::error::Either CRON_SECRET here and in Vercel have drifted apart, or APP_URL redirects to another host and the Authorization header was dropped on the way. Check the address before touching the secret."
            fi

            exit 1
          fi

          raised=$(printf '%s' "$body" | node -e "
            let s = '';
            process.stdin.on('data', (d) => (s += d)).on('end', () => {
              try { console.log(JSON.parse(s).data.raised ?? 0); } catch { console.log(0); }
            });
          ")

          echo "trucks newly reported as quiet: $raised" >> "$GITHUB_STEP_SUMMARY"
