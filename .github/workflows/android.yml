name: Android APK

# The APK is a shell that loads the deployed site at runtime - it does not
# bundle the app. A change to a booking screen produces a byte-identical APK,
# so this builds only when something that genuinely affects it changes, plus
# on demand from the Actions tab (Run workflow).
on:
  push:
    branches: [main, monorepo-copy]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-shell/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14.3 does not support Java 25. Android Studio bundles its own
      # JDK 21; CI has to ask for one.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No setup-android action here. It decided the runner's preinstalled
      # sdkmanager was the wrong version, downloaded a newer one, and then ran
      # "sdkmanager --licenses" with nothing on stdin to answer its "Accept?
      # (y/N)" prompt - so it printed every license into the log and died.
      #
      # The runner already ships an Android SDK with its licenses accepted.
      # compileSdkVersion 36 is recent enough that the image may not carry it,
      # so it is installed explicitly, with "yes" answering any prompt.
      # Licence output is discarded: it is thousands of lines.
      #
      # Build tools are left to AGP 8.13, which picks its own default -
      # pinning a version here would be a guess at what it wants.
      - name: Install the compile SDK
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using $SDKMANAGER"
          # sdkmanager exits non-zero when yes(1) closes the pipe, which is not
          # a failure; the install that follows is what has to succeed.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "platform-tools" | grep -v "^[" || true
          test -d "$ANDROID_HOME/platforms/android-36" || {
            echo "::error::platforms/android-36 was not installed"; exit 1;
          }

      # npm ci failed on the runner with "Missing: @emnapi/runtime from lock
      # file". Those are optional transitive dependencies of a wasm32-wasi
      # binary, and npm writes them into the lockfile in a shape that depends
      # on the platform and npm major that generated it - this one was written
      # by npm 11 on Windows. Node 24 above matches that npm major, which
      # resolves it in the common case; the fallback keeps a lockfile written
      # on another machine from blocking every build, and warns rather
      # than failing silently.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci could not use the lockfile on this platform; falling back to npm install. Regenerate package-lock.json on Linux or macOS to fix it properly."
            npm install --no-audit --no-fund
          }

      # Writes android/app/src/main/assets/capacitor.config.json with the
      # server URL from capacitor.config.ts. Both that file and the copied web
      # assets are gitignored, so this step is what puts them in place.
      - name: Sync the native project
        run: npx cap sync android

      - name: Show what the APK will point at
        run: cat android/app/src/main/assets/capacitor.config.json

      # One key for every build, kept as a secret and written out here. A debug
      # key is regenerated per machine, so each build was a different signer
      # and a phone refused to install one over another: the app had to be
      # uninstalled, taking the signed-in session with it, every time.
      - name: Write out the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Falling back to the debug key, which will not install over an app signed by any other build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/logisco-release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        env:
          # Empty without the secret, which is what sends build.gradle down
          # its debug-key path rather than failing part-way through signing.
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/logisco-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Say what came out
        run: |
          ls -l android/app/build/outputs/apk/release/
          {
            echo "### Logisco APK"
            echo ""
            echo "- Version 1.0.${{ github.run_number }} (build ${{ github.run_number }})"
            echo "- Signed with the release key: ${{ steps.signing.outputs.signed }}"
            echo "- Download it from Artifacts below, then open it on the phone."
          } >> "$GITHUB_STEP_SUMMARY"

      # Installing it needs "install unknown apps" allowed for whatever opens
      # the file on the phone - the browser, or Files.
      - uses: actions/upload-artifact@v4
        with:
          name: logisco-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
